services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phalcon_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ODOO_URL: ${ODOO_URL}
      ODOO_DB: ${ODOO_DB}
      ODOO_USERNAME: ${ODOO_USERNAME}
      ODOO_PASSWORD: ${ODOO_PASSWORD}
    volumes:
      - ./:/var/www/html
    networks:
      - phalcon_network
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: phalcon_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8181}:81"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - phalcon_network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: phalcon_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - phalcon_network
    # Port MySQL tidak perlu di-expose keluar (hanya akses internal)
    # Jika perlu akses dari luar, uncomment dan ganti port jika 3306 sudah dipakai
    # ports:
    #   - "3307:3306"

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phalcon_phpmyadmin
    restart: unless-stopped
    ports:
      - "8182:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USER}
      PMA_PASSWORD: ${DB_PASSWORD}
    networks:
      - phalcon_network
    depends_on:
      - mysql

  # Odoo ERP System
  postgres_odoo:
    image: postgres:15
    container_name: phalcon_odoo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoo123}
    volumes:
      - odoo_postgres_data:/var/lib/postgresql/data
    networks:
      - phalcon_network
    # Port PostgreSQL tidak perlu di-expose keluar (hanya akses internal)
    # Jika perlu akses dari luar, uncomment:
    # ports:
    #   - "5433:5432"

  odoo:
    image: odoo:17.0
    container_name: phalcon_odoo
    restart: unless-stopped
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      HOST: postgres_odoo
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo123}
      # Master password untuk manage databases (PENTING: ubah di production!)
      ODOO_MASTER_PASSWORD: ${ODOO_MASTER_PASSWORD:-admin}
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo-addons:/mnt/extra-addons  # Folder untuk custom addons
    networks:
      - phalcon_network
    depends_on:
      - postgres_odoo

networks:
  phalcon_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  odoo_postgres_data:
    driver: local
  odoo_data:
    driver: local
